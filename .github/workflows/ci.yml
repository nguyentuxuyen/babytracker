name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: API modules load
        run: |
          for f in api/*.js; do node -e "require('./$f')"; done
          node -e "require('./api/_schema').loadSchema().then((s) => { if (!s.buildActivityDoc) process.exit(1); })"
      - name: Build
        run: npm run build
